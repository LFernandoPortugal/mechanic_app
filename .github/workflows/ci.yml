name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public, non-production placeholders used only for Next.js prerendering.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-mechanic-app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci000000000000"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CI00000000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Lint
        run: npm run lint

      - name: Unit, API integration, and Firestore Rules tests
        run: npm run test:all

      - name: Browser E2E against Firebase emulators
        run: npm run test:e2e

      - name: Production build
        run: npm run build
